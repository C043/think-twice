<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Think Twice</title>
    <!--
      Standalone iOS has no address bar, so a failed launch leaves the user with
      a blank screen and no way to retry. This page is precached by the service
      worker and served whenever a navigation cannot reach the server, purely so
      that there is something on screen with a way out of it.

      Everything is inline: a page that only renders when the network is gone
      cannot pull a stylesheet or a font over that same network.
    -->
    <style>
      :root {
        --background: #f6f6f7;
        --foreground: #09090b;
        --surface: #ffffff;
        --line: #e6e6e9;
        --muted: #71717a;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
      }

      /* Mirrors the tokens in globals.css. The class comes from the inline
         script below, which reads the same next-themes key the app writes. */
      :root.dark {
        --background: #08080a;
        --foreground: #fafafa;
        --surface: #101013;
        --line: #232327;
        --muted: #8b8b94;
        --accent: #818cf8;
        --accent-hover: #6366f1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
          calc(24px + env(safe-area-inset-left));
        background: var(--background);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 22rem;
        text-align: center;
      }

      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: var(--muted);
      }

      button {
        margin-top: 24px;
        width: 100%;
        padding: 12px 20px;
        /* 16px floor, same reason as every other control in this app: below it
           iOS zooms the viewport in on focus and never zooms back out. */
        font-size: 16px;
        font-weight: 500;
        font-family: inherit;
        color: #ffffff;
        background: var(--accent);
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        touch-action: manipulation;
      }

      button:hover {
        background: var(--accent-hover);
      }

      button[disabled] {
        opacity: 0.6;
      }

      .status {
        margin-top: 16px;
        font-size: 0.8125rem;
        color: var(--muted);
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Can&rsquo;t reach Think Twice</h1>
      <p>
        The app is served over your tailnet, so this usually means the connection
        dropped rather than the server being down.
      </p>
      <button type="button" id="retry">Try again</button>
      <p class="status" id="status">Retrying automatically&hellip;</p>
    </main>

    <script>
      (function () {
        // next-themes writes "light" | "dark" | "system" under this key. Read it
        // before first paint so the fallback does not flash the wrong palette.
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}

        var button = document.getElementById("retry");
        var status = document.getElementById("status");
        var checking = false;

        // A HEAD to the root with cache: "no-store" tells us the server is
        // answering again without pulling the whole document twice.
        //
        // The abort matters as much as the request. The failure this page is
        // shown for is a connection that hangs rather than one that is refused,
        // so an unbounded fetch would leave `checking` stuck at true and kill
        // every later attempt — the auto-recovery would die on exactly the
        // failure it exists for.
        function probe() {
          if (checking) return Promise.resolve(false);
          checking = true;

          var controller = new AbortController();
          var timer = setTimeout(function () {
            controller.abort();
          }, 4000);

          return fetch("/", {
            method: "HEAD",
            cache: "no-store",
            signal: controller.signal,
          })
            .then(function (res) {
              return res.ok;
            })
            .catch(function () {
              return false;
            })
            .then(function (ok) {
              clearTimeout(timer);
              checking = false;
              return ok;
            });
        }

        function reload() {
          location.replace("/");
        }

        button.addEventListener("click", function () {
          button.disabled = true;
          status.textContent = "Checking…";
          probe().then(function (ok) {
            if (ok) return reload();
            button.disabled = false;
            status.textContent = "Still unreachable.";
          });
        });

        // The whole point of this page: recover on its own. The refusals that
        // cause it last seconds, and in standalone mode there is no reload
        // button to press once they pass.
        setInterval(function () {
          probe().then(function (ok) {
            if (ok) reload();
          });
        }, 5000);

        // Fires when the tailnet interface comes back on iOS, usually well
        // before the next poll would have.
        addEventListener("online", function () {
          probe().then(function (ok) {
            if (ok) reload();
          });
        });
      })();
    </script>
  </body>
</html>
