services:
  postgres:
    image: postgres:15-alpine
    container_name: think_twice_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
      POSTGRES_DB: ${DB_NAME:-think_twice_db}
    ports:
      # Loopback only. Containers reach Postgres over the compose network, so
      # publishing on every interface just exposed the database to the whole LAN
      # — with the default password, on a machine that is always on.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - think_twice_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-think_twice_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  think_twice_network:
    driver: bridge

volumes:
  postgres_data:
