services:
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Inlined into the client bundle by `next build`. Both are values the
        # browser receives anyway; the VAPID private key is never a build arg.
        # Changing either needs `up --build`, not just a restart.
        - NEXT_PUBLIC_APP_URL=${PROD_APP_URL}
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
    container_name: think_twice_app_prod
    restart: always
    ports:
      # Loopback only: `tailscale serve` runs on the host and proxies to
      # localhost, so nothing else needs to reach this port. Published on every
      # interface it would also answer over plain HTTP on the LAN, bypassing
      # Tailscale entirely — and the app has no authentication of its own.
      #
      # The host side comes from APP_PORT so a deployment whose 3000 is taken
      # sets it in .env rather than editing this tracked file and conflicting on
      # every pull. The container side is fixed by the Dockerfile.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-secret_password}@postgres:5432/${DB_NAME:-think_twice_db}?schema=public
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - NEXT_PUBLIC_APP_URL=${PROD_APP_URL}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
    # Only the migrations run here: they need a reachable database, which an
    # image build does not have. The Next build already happened in the image, so
    # a restart no longer takes the app down for the length of a rebuild.
    command: sh -c "npx drizzle-kit migrate && npm run start"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - think_twice_network
