services:
  postgres:
    image: postgres:15-alpine
    container_name: think_twice_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
      POSTGRES_DB: ${DB_NAME:-think_twice_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - think_twice_network

networks:
  think_twice_network:
    driver: bridge

volumes:
  postgres_data:
